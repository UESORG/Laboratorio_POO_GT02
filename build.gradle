plugins {
    id 'java'
    id 'application'
}

group 'org.laboratorio2'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
}

application {
    mainClass = 'org.laboratorio2.controller.Main'
}

// Tarea explicita para ejecutar el motor de reservas: ./gradlew runHotel
tasks.register('runHotel', JavaExec) {
    group = 'application'
    description = 'Ejecuta org.laboratorio2.controller.Main'
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('org.laboratorio2.controller.Main')
}

test {
    useJUnitPlatform()
}